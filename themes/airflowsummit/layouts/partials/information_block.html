<section class="info-block-section" style="margin-bottom: -30px;">
  <div class="info-block text-center">
    <p>Look back to the previous editions</p>

    <h3 class="text-center"></h3>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    .swiper {
      padding-top: 50px;
    }

    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 400px;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
    }
  </style>

  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">

      {{ $images := resources.Match "images/carousel/2026/*.{jpg,jpeg,png,webp}" }}
      {{ range $images }}

      {{ $img := . }}

      {{ if $img }}
      {{ $webp := $img.Resize (printf "%dx webp q85" $img.Width) }}

      <div class="swiper-slide">
        <picture>
          <source srcset="{{ $webp.RelPermalink }}" type="image/webp">
          <img src="{{ $img.RelPermalink }}" alt="" loading="lazy">
        </picture>
      </div>
      {{ end }}
      {{ end }}

    </div>
    <div class="swiper-pagination"></div>
  </div>
</section>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- Initialize Swiper -->
<script>
  var swiper = new Swiper(".mySwiper", {
    effect: "coverflow",
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: "auto",
    autoplay: {
      delay: 2500,
      disableOnInteraction: false,
    },
    coverflowEffect: {
      rotate: 50,
      stretch: 0,
      depth: 100,
      modifier: 1,
      slideShadows: true,
    },
    pagination: {
      el: ".swiper-pagination",
    },
  });
</script>
